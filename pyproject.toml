[project]
name = "law"
version = "6.0.0"
description = "LAW v6 — Local AI Workstation: installer, job queue, agents, Telegram and CLI for an Apple Silicon AI server"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = [
  "typer>=0.27.3",
  "rich>=15.0.0",
  "pydantic>=2.12,<2.14",
  "pyyaml>=6.0.3",
  "httpx>=0.28.1",
  "fastapi>=0.146.0",
  "uvicorn>=0.54.0",
  "sse-starlette>=3.5.0",
  "python-multipart>=0.0.32",
  "redis>=8.1.0",
  "aiogram>=3.31.0",
  "psutil>=7.2.2",
  "mcp>=2.3.0",
  "ruamel.yaml>=0.19.1",
]

[project.scripts]
law = "law.cli:app"

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "pytest-cov>=7.1.0",
  "ruff>=0.17.1",
  "mypy>=2.4.0",
  "fakeredis>=2.40.0",
  "pillow==12.3.0",
  "types-PyYAML>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/law"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PTH", "ASYNC"]
ignore = ["S603", "S607", "S404", "S101", "PTH123"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PTH", "E501"]
"src/law/handlers/**" = ["ASYNC240"]
"scripts/**" = ["PTH"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["law"]

[[tool.mypy.overrides]]
module = ["fakeredis.*", "psutil.*", "mlx.*", "mlx_audio.*", "soundfile", "numpy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["law.mcp_mac"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# Plain `pytest` never touches the live stack (2026-10-26: it queued a 40 GB image job behind a running build);
# run those suites by name, e.g. `pytest -m integration tests/integration`.
addopts = "-ra --strict-markers -m 'not integration and not e2e and not rerun'"
asyncio_mode = "auto"
markers = [
  "integration: needs real services on this Mac",
  "e2e: end-to-end against running services",
  "rerun: installer re-run guarantees (slow)",
  "heavy: loads real models",
]

[tool.coverage.run]
source = ["law"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
