[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "law"
version = "2.0.0.dev11"
description = "Local AI Workstation v2 — control plane"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pyyaml>=6.0",
  "psutil>=5.9",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
law = "law.cli:main"

[tool.setuptools.packages.find]
include = ["law*"]

[tool.setuptools.package-data]
law = ["registry.yaml"]
