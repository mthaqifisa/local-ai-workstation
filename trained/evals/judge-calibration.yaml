- id: judgement-vendor/good
  case: judgement-vendor
  kind: good
  flaw: ''
  prompt: A 40-person bank branch network must choose between a SaaS core-banking add-on and building in-house. Give a recommendation
    with the 3 decisive factors and the main risk.
  response: |
    **Recommendation: buy the SaaS core-banking add-on. Do not build in-house.** For a 40-person branch network, in-house core-banking development is an economic and regulatory misfit: the core is a system of record, which is a permanent, heavily controlled operating cost — not a one-time build. A 40-person organization has neither the engineering bench nor the audit capacity to carry it.

    **The 3 decisive factors**

    | Decisive factor | SaaS add-on | In-house build |
    |---|---|---|
    | **1. Compliance & audit burden** | Vendor maintains certified controls (demand SOC 2 / ISO 27001 evidence, audit rights, data-residency terms); responsibility is shared | Your branch staff — not engineers — inherit a control framework you must build, evidence and defend at every regulatory examination, indefinitely |
    | **2. Total cost of ownership** | Predictable run-rate; the vendor's engineering cost is amortized across many institutions | A platform team plus infrastructure, perpetual upgrades, regulatory-change cycles and incident response; over 5–7 years this is almost certainly a multiple of the SaaS run-rate, with a multi-year build ahead of it |
    | **3. Time-to-value & focus** | Working capability in months; scarce people stay on front-of-house service, which is where a branch network actually competes | Years to first value, consuming exactly the capacity the branches need to serve customers; a ledger is not a differentiator at this size |

    Factor 1 is usually the real decision-maker: the system of record carries the heaviest control obligations (GL integrity, complete audit trails, BCP/DR, data residency). Buying transfers most of that standing burden to a vendor with an incentive to keep it certified; building concentrates it on a 40-person organization.

    **The main risk: vendor lock-in and dependency.** Your system of record sits with one vendor, creating exit cost, roadmap misalignment, and concentration risk if the vendor's financial or strategic health deteriorates. This is manageable — but only if negotiated, not discovered:

    - Contractual data export in standard formats plus an exit-assistance clause.
    - Keep customer master data and reporting extracts in your own data store, so the SaaS is a service, not your sole source of truth.
    - Integrate only through documented APIs behind your own thin abstraction layer; no bespoke coupling.
    - SLA, data-residency, sub-processor, audit-rights and business-continuity terms in the contract.
    - Annual vendor-viability review (financials, support coverage, references from comparable banks).

    **Assumptions and when this flips**

    - The add-on extends a stable existing core; if the SaaS actually requires *replacing* your core system of record, re-run this analysis — a core migration changes the risk profile and timeline materially.
    - Your jurisdiction and regulator accept the vendor's residency and sub-processing; if not, that constraint may force a regional vendor or a different architecture, but still not a 40-person in-house build.
    - In-house only wins if the capability is a genuine differentiator competitors can't easily license **and** you already run a standing engineering organization. A 40-person branch network typically has neither.

    Open question to settle before contracting: confirm the add-on's exact feature scope against your top 5–10 branch use cases, and get the vendor's data-portability mechanics in writing — everything else above is negotiation, not architecture.
