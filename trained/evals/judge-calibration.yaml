  case: code-function
  kind: good
  flaw: ''
  prompt: 'Write a typed Python function `parse_duration(s: str) -> int` that converts strings like ''1h30m'', ''45s'', ''2h'',
    ''3m15s'' to seconds and raises ValueError on invalid input. Include pytest tests covering edge cases. Code only.'
  response: |
    ```python
    # parse_duration.py
    import re


    def parse_duration(s: str) -> int:
        """Convert a duration string like '1h30m', '45s', '2h' to total seconds.

        Raises:
            ValueError: If the string is not a valid duration.
        """
        if not s:
            raise ValueError(f"Invalid duration: {s!r}")

        matches = re.findall(r"(\d+)([hms])", s)

        if not matches:
            raise ValueError(f"Invalid duration: {s!r}")

        if "".join(n + u for n, u in matches) != s:
            raise ValueError(f"Invalid duration: {s!r}")

        units = [u for _, u in matches]
        if units != sorted(set(units)) or len(units) != len(set(units)):
            raise ValueError(f"Invalid duration: {s!r}")

        multipliers = {"h": 3600, "m": 60, "s": 1}
        return sum(int(n) * multipliers[u] for n, u in matches)
    ```

    ```python
    # test_parse_duration.py
    import pytest

    from parse_duration import parse_duration


    @pytest.mark.parametrize(
        ("input_str", "expected"),
        [
            ("1h", 3600),
            ("2h", 7200),
            ("30m", 1800),
            ("1m", 60),
            ("45s", 45),
            ("1s", 1),
            ("1h30m", 5400),
            ("3m15s", 195),
            ("1h2m3s", 3723),
            ("0s", 0),
            ("100h", 360000),
            ("007s", 7),
        ],
    )
    def test_valid(input_str: str, expected: int) -> None:
        assert parse_duration(input_str) == expected


    @pytest.mark.parametrize(
        "input_str",
        [
            "",          # empty
            "h",         # unit without number
            "m",
            "s",
            "123",       # no unit
            "1x",        # unknown unit
            "1h30x",     # unknown unit in middle
            "1h 30m",    # space
            "-1h",       # negative
            "1m1h",      # wrong order
            "1s1m",      # wrong order
            "1h1h",      # duplicate unit
            "abc",       # no digits
            "1.5h",      # float
            "1h2m3s4h",  # out-of-order after duplicate
        ],
    )
    def test_invalid(input_str: str) -> None:
        with pytest.raises(ValueError):
            parse_duration(input_str)
    ```
