    | Risk | Likelihood / Impact | Mitigation |
    |---|---|---|
    | Data-sovereignty / regulatory breach | Low / High | Legal & compliance review before each cohort; residency-constrained workloads stay on-prem or in approved regions |
    | Vendor lock-in | Medium / Medium | Multi-cloud from day one; containerise (Kubernetes) for portability; contractual exit clauses |
    | Security misconfiguration | Medium / High | Zero-trust network architecture; automated compliance scanning in CI/CD; independent pen-test per phase gate |
    | Slippage / cost overrun | Medium / Medium | Phase gates with go/no-go; 10% budget contingency; named accountable executive with monthly board reporting |
    | Skills gap | Medium / Low | Up-skill 20–30 FTEs via structured programme; retain specialist partner for first 12 months with knowledge-transfer milestones |

