- id: calc-loan-payment/good
  case: calc-loan-payment
  kind: good
  flaw: ''
  prompt: Monthly payment on a 400,000 loan at 4.2% annual interest over 30 years (standard amortisation)? Round to 2 decimals
    and give the number on the last line.
  response: |
    ## Answer

    **Monthly payment: $1,956.07** (unrounded: $1,956.0687)

    ## Method

    Standard fully-amortising annuity formula:

    M = P · r · (1+r)ⁿ / ((1+r)ⁿ − 1)

    - P = 400,000 (principal)
    - Annual rate = 4.2% → monthly rate r = 0.042 / 12 = 0.0035
    - n = 30 × 12 = 360 monthly payments

    Calculation (Decimal precision, 50 digits):
    - (1+r)³⁶⁰ ≈ 3.77894…
    - M = 400,000 × 0.0035 × 3.77894… / (3.77894… − 1) = **1,956.068694854… → 1,956.07**

    ## Sanity checks

    | Check | Result |
    |---|---|
    | Month 1 interest = 400,000 × 0.0035 | 1,400.00 (so 556.07 principal — reasonable at 4.2%) |
    | Full amortisation simulation, 360 payments | Balance after month 360 ≈ 0.000000012 → ✓ payoff exact |
    | Total repaid over 30 yrs | 1,956.0687 × 360 ≈ 704,184.73 |
    | Total interest over 30 yrs | ≈ 304,184.73 (≈ 76% of principal, typical for 30-yr at low rate) |
    | Cross-check in float64 | 1,956.068694854088 — matches Decimal result |

    ## Assumptions
    - 12 equal monthly payments in arrears, first payment one month after disbursement.
    - Rate 4.2% is nominal APR compounded monthly (standard mortgage convention).
    - No fees, insurance, or rounding adjustments on the payment itself.

    **1956.07**
