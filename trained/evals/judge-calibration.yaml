- id: calc-statistics/good
  case: calc-statistics
  kind: good
  flaw: ''
  prompt: 'Sample standard deviation of: 12, 15, 11, 19, 23, 17, 14. Round to 3 decimals; give the number on the last line.'
  response: |
    ## Answer: **4.180**

    **Method (sample standard deviation, n−1 denominator):**

    1. Data: 12, 15, 11, 19, 23, 17, 14 → n = 7
    2. Mean: 101 / 7 = **15.857143**
    3. Sum of squared deviations: Σ(xᵢ − x̄)² = **104.857143**
    4. Sample variance: 104.857143 / (7 − 1) = **17.476190**
    5. Sample SD: √17.476190 = **4.180453** → rounded to 3 decimals = **4.180**

    **Sanity check:**
    - NumPy `np.std(data, ddof=1)` = 4.180453381… ✓ matches by hand
    - Range is 11–23 (width 12); for 7 points a SD of ~4.2 (≈ one-third of the range) is reasonable for a fairly spread sample.
    - Units: same as the input data (none specified). Precision: 3 decimal places as requested.

    4.180
