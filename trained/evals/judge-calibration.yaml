- id: reason-logic/good
  case: reason-logic
  kind: good
  flaw: ''
  prompt: Alice is older than Bob. Carol is younger than Bob. Dan is older than Alice. Who is the second oldest? Answer with
    one name on the last line.
  response: |
    Let me work through this logically.

    From the given statements:
    - **Alice is older than Bob** → Alice > Bob
    - **Carol is younger than Bob** → Bob > Carol
    - **Dan is older than Alice** → Dan > Alice

    Combining them:
    - Dan > Alice
    - Alice > Bob
    - Bob > Carol

    This gives us the order from oldest to youngest: **Dan, Alice, Bob, Carol**

    The second oldest is **Alice**.

    Alice
