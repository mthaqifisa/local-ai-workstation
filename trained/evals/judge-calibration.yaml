    - In-house only wins if the capability is a genuine differentiator competitors can't easily license **and** you already run a standing engineering organization. A 40-person branch network typically has neither.

    Open question to settle before contracting: confirm the add-on's exact feature scope against your top 5–10 branch use cases, and get the vendor's data-portability mechanics in writing — everything else above is negotiation, not architecture.
