- id: reason-base-rate/good
  case: reason-base-rate
  kind: good
  flaw: ''
  prompt: A disease affects 1% of people. A test has 95% sensitivity and 90% specificity. If someone tests positive, what
    is the probability they have the disease? Give a percentage to one decimal on the last line.
  response: |
    **Answer: 8.8%** — even a positive result makes disease much less likely than not, due to the low base rate.

    **Method (Bayes' theorem)**

    P(disease | +) = P(+) | disease) × P(disease) / P(+), where:
    - P(+) = sensitivity × prevalence + (1 − specificity) × (1 − prevalence) = 0.95 × 0.01 + 0.10 × 0.99 = 0.0985

    So P(+|disease) = (0.95 × 0.01) / 0.0985 = 0.0095 / 0.0985 ≈ 0.08756

    **Sanity check (natural frequencies, 10,000 people)**
    - Infected: 100 → true positives: 95
    - Uninfected: 9,900 → false positives: 990
    - Positive: 95 / (95 + 990) = 95 / 1085 ≈ 8.756% ✓ matches the Bayes result.

    Intuition: the test has a 10% false positive rate, and disease affects only 1% of people, so false positives swamp true positives roughly 10:1 — which is exactly why the answer is so low despite a "good" test.

    **Assumptions:** the given 1% prevalence applies to the tested person's population; the test's properties are as stated.

    8.8
