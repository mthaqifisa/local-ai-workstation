- id: code-sql/good
  case: code-sql
  kind: good
  flaw: ''
  prompt: Write a single SQL query (PostgreSQL) returning, per customer, total spend in 2025 and their rank by spend, from
    tables customers(id, name) and orders(id, customer_id, amount, created_at). Customers with no 2025 orders must appear
    with 0.
  response: |
    ```sql
    SELECT
        c.id,
        c.name,
        COALESCE(SUM(o.amount), 0) AS total_spend_2025,
        RANK() OVER (ORDER BY COALESCE(SUM(o.amount), 0) DESC) AS spend_rank
    FROM customers c
    LEFT JOIN orders o
        ON  o.customer_id = c.id
        AND o.created_at >= '2025-01-01'
        AND o.created_at <  '2026-01-01'
    GROUP BY c.id, c.name
    ORDER BY spend_rank, c.id;
    ```

    **How it works**

    | Concern | How it's handled |
    |---|---|
    | Customers with no 2025 orders appear | `LEFT JOIN` preserves every row from `customers`; the 2025 filter is in the `ON` clause, not `WHERE`, so it can't null out the left side. |
    | Total defaults to 0 | `COALESCE(SUM(o.amount), 0)` — `SUM` returns `NULL` when there are no matching rows. |
    | Ties share a rank | `RANK()` (as opposed to `ROW_NUMBER()`) gives equal-spend customers the same rank and skips the next (1, 1, 3). |
    | Deterministic output | Final `ORDER BY spend_rank, c.id` breaks ties alphabetically/numerically by id. |

    **Notes / assumptions**

