- id: design-critique/good
  case: design-critique
  kind: good
  flaw: ''
  prompt: A login page uses light grey (#AAAAAA) text on a white background, 11px font, and the only error message is a red
    border. List the accessibility problems with the WCAG criteria they break and concrete fixes.
  response: |
    # Accessibility Audit: Login Page

    **Three failures, two of them Level A (the lowest priority tier in WCAG, meaning they are the most critical). Compounded together, a user with low vision *and* colour blindness would be unable to complete the form.**

    ---

    ## 1. Contrast — #AAAAAA on #FFFFFF

    | | |
    |---|---|
    | **Contrast ratio** | **2.32 : 1** (calculated from relative luminance) |
    | **Criterion** | **1.4.3 Contrast (Minimum) — Level AA** |
    | **Required ratio** | 4.5 : 1 for "normal text" (anything below 24 px / 18 pt regular, or below 18.7 px / 14 pt bold) |
    | **Also fails** | 1.4.6 Contrast (Enhanced) — Level AAA (7 : 1) |

    The 11 px size is relevant here: because the text is well below the "large text" threshold, the stricter 4.5 : 1 ratio applies rather than 3 : 1.

    **Fix**

    | Target | Hex | Ratio on white | Level |
    |---|---|---|---|
    | Minimum pass | `#767676` | 4.54 : 1 | AA |
    | Recommended | `#595959` | 7.00 : 1 | AAA |
    | Label / helper text (same treatment) | `#595959` | 7.00 : 1 | AAA |

    Apply the same contrast to placeholder text, which sits in the same light-grey range.

    ---

    ## 2. Font size — 11 px

    | | |
    |---|---|
    | **Size** | 11 px ≈ 8.25 pt |
    | **Criterion** | No single SC mandates a pixel minimum, but 11 px interacts with two that you do break: |
    | | **1.4.4 Resize Text (AA)** – the user must be able to zoom to 200 % (→ 22 px) without loss of content or functionality. At 11 px the layout is almost certainly not tested at that scale; labels and inputs will overlap or wrap. |
    | | **1.4.3 Contrast (AA)** – the small size keeps the text in the "normal text" band, so the 4.5 : 1 ratio (not the more lenient 3 : 1) applies. This is what makes the #AAAAAA colour a hard fail. |
    | **Practical impact** | 8.25 pt is below the comfortable reading size for many adults and well below the 10 pt minimum that most government and banking style guides require. |

    **Fix**

    | Element | Minimum | Recommended |
    |---|---|---|
    | Body / instructions | 14 px (10.5 pt) | 16 px (12 pt) |
    | Form labels & inputs | 14 px | 16 px |
    | Helper / error text | 14 px | 14 px |
    | Line-height | ≥ 1.5× the font size | 1.6× |

    Add `meta name="viewport" content="width=device-width, initial-scale=1"` and test the page at 200 % browser zoom (and at 400 % for high-contrast Windows settings) to satisfy 1.4.4.

    ---

    ## 3. Error indicated only by a red border

    This single design choice breaks **four** separate success criteria:

    | # | Criterion (Level) | What it requires | Why a red border fails |
    |---|---|---|---|
    | 1 | **1.4.1 Use of Color (A)** | Colour must not be the *only* visual means of conveying information. | A user with deuteranopia or protanopia (~ 8 % of men) sees the "red" border as a muddy brown/yellow that is easy to mistake for the normal border state. |
    | 2 | **3.3.1 Error Identification (A)** | The item in error must be identified **and** the error described **in text**. | A border is a visual cue, not a text description. |
    | 3 | **4.1.3 Status Messages (AA)** | The status of user input that can be presented visually must also be **programmatically determinable**. | A CSS class change (`.border-red`) is invisible to screen readers unless an `aria` attribute or live region is added. |
    | 4 | **1.3.1 Info and Relationships (A)** | Information conveyed through presentation must be available to assistive tech. | No `role="alert"`, no `aria-describedby`, no text node — the screen reader hears nothing. |

    A fifth, softer criterion is also at risk:

    | 5 | **3.3.3 Error Suggestion (AA)** | "If possible, suggestions for correction are provided." | A bare red border gives no guidance on *what* is wrong or *how* to fix it. |

    **Fix — add all of the following**

    ```html
    <!-- Label -->
    <label for="password" class="field-label">Password</label>

    <!-- Input with error state -->
    <input
      id="password"
      type="password"
      aria-invalid="true"
      aria-describedby="password-error"
      class="input input--error"
    />

    <!-- Visible, textual error message (not colour-dependent) -->
    <p id="password-error" role="alert" class="error-msg">
      <svg aria-hidden="true" class="error-icon">…</svg>
      <span>Password must be at least 8 characters and include a number.</span>
    </p>
    ```

    - **Text message** next to (or below) the field, in the same ≥ 14 px size, at ≥ 4.5 : 1 contrast (e.g. `#B00020` on white = 5.55 : 1).
    - **Icon** (⚠ or ✕) as a non-colour cue.
    - **`aria-invalid="true"`** on the input so AT announces "invalid entry".
    - **`aria-describedby`** pointing to the error paragraph so the message is read on focus.
    - **`role="alert"`** (or a live region) so the message is announced when it appears without moving focus.
    - Keep the red border as an *additional* visual cue, not the only one.

    ---

    ## Quick-reference checklist

    | Problem | SC broken | Level | One-line fix |
    |---|---|---|---|
    | #AAAAAA on white (2.32 : 1) | 1.4.3 | AA | Darken to `#595959` (7 : 1) |
    | 11 px type | 1.4.4 (interaction), 1.4.3 (band) | AA | ≥ 14 px, test at 200 % zoom |
    | Red border as sole error cue | 1.4.1, 3.3.1, 4.1.3, 1.3.1, 3.3.3 | A / AA | Add text + icon + `aria-invalid` + `role="alert"` |

    **Assumptions I made:** the page uses a standard white `#FFFFFF` background (not off-white); the 11 px applies to labels, inputs, and helper text alike; the "red border" is a CSS `border-color` change with no accompanying text or ARIA. If any of those differ, the specific SC affected shifts slightly, but the fixes remain the same.
