    # Executive Memo — Migration of 30% of Workloads to Cloud
    *Office of the Chief Information Officer · 23 November 2026*

    ## Recommendation

    Approve migration of **30% of current on-premises workloads** (≈30% by compute hours) to a multi-cloud platform over **18 months**, targeting completion by **June 2028**. This is a phased, workload-by-workload programme — not a big-bang lift-and-shift — and is reversible at each phase gate.

    ## Rationale

    1. **End-of-life exposure.** Several on-prem platforms (servers, OS, firmware) reach vendor end-of-life within 24 months. Continued operation past EOL carries increasing security and compliance risk; re-platforming in-house commits $8–12 M capex with a 24-month delivery lead time.
    2. **Speed.** Cloud-native services cut provisioning from weeks to hours, shortening time-to-market for new products and model deployments.
    3. **Resilience & compliance.** A multi-cloud posture (primary + secondary region, ≥2 providers) reduces single-point-of-failure risk and meets business-continuity expectations under PRA/SSB-5 and FCA expectations for critical operations.
    4. **18-month financial neutrality.** The direct P&L impact over 18 months is broadly breakeven (see table). The financial case strengthens beyond month 18 as the next on-prem refresh cycle is avoided entirely.

    ## Costs and Benefits (planning estimates)

    | Category | 18-month amount | Notes |
    |---|---|---|
    | Cloud consumption | $6–8 M (variable) | Scales with usage; no capex; predictable via reserved instances |
    | Migration labour & tools | $3–5 M | Internal FTE + specialist partners |
    | **Total 18-month cost** | **$9–13 M** | |
    | Avoided capex (on-prem refresh) | $8–12 M avoided | Servers, storage, cooling, DC fit-out |
    | **Net 18-month position** | **−$5 M to +$3 M** | Range reflects cost and capex uncertainty; mid-case ≈ breakeven |
    | Beyond 18 months (qualitative) | Materially positive | Second refresh cycle avoided; variable cost aligns with demand |
    | Productivity uplift (est.) | 5–10% faster delivery | Tracked via lead-time KPI; not included in P&L above |

    *Planning estimates pending Phase 1 discovery. Figures are internal planning ranges, not vendor quotes. No currency or country assumption added beyond current reporting basis.*

