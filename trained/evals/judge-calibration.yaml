- id: calc-compound-interest/good
  case: calc-compound-interest
  kind: good
  flaw: ''
  prompt: An investment of 25,000 grows at 6.5% per year compounded monthly for 7 years. What is the final value, rounded
    to the nearest whole number? Give the number on the last line.
  response: |
    **Answer: 39,356**

    **Method** — monthly compounding: FV = P·(1 + r/n)^(n·t)
    - P = 25,000, r = 0.065, n = 12, t = 7 → 84 compounding periods
    - FV = 25,000 × (1.0054167)^84 = 39,355.98

    **Sanity check** — 7 years at 6.5% annual is a growth factor of roughly (1.065)^7 ≈ 1.554, i.e. ≈ 38,850 with annual compounding; monthly compounding adds a little, and 39,356 sits right where expected.

    39356
