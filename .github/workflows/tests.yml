name: tests
on:
  push:
  pull_request:
jobs:
  pytest:
    runs-on: macos-14            # Apple Silicon (arm64), like the target Macs
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Run tests (fake model server, fake system — no models or Docker needed)
        run: uv run --python 3.12 --with pytest python -m pytest -q tests
